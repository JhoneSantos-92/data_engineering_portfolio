</head>
<body>
    <header>
        <nav>
            <div class="nav-bar">
                <a href="../index.html" class="logo"><span class="logo-dot">&gt;</span>_jhone.santos</a>
                <ul id="navMenu">
                    <li><a href="../index.html">Voltar ao Portfólio</a></li>
                    <li>
                        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema claro/escuro" aria-pressed="false">
                            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
                        </button>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="project-detail-wrap">
        <a href="../index.html" class="back-link">&larr; Voltar para a Página Principal</a>

        <div class="project-detail-container" id="project-content">
            <h1 style="text-align: center; color: var(--color-text-muted);">Carregando detalhes do projeto...</h1>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Jhone Estefano dos Santos. Todos os direitos reservados.</p>
    </footer>

    <script>
        const projectsData = {
            "medallion-lake": {
                title: "Data Lake Moderno em Medallion Architecture",
                tags: ["Databricks", "PySpark", "Python", "Airflow", "AWS S3"],
                problem: "A Cortex precisava de um repositório centralizado, confiável e altamente escalável para processar volumes massivos de dados corporativos de forma ágil. A ausência de uma estruturação adequada de dados gerava gargalos operacionais e dificultava a tomada de decisões corporativas baseadas em informações de qualidade.",
                solution: "Desenho e implementação de uma arquitetura de Data Lake escalável com o conceito de Medalhão (Bronze, Silver e Gold). Utilizando Python e PySpark no Databricks, os dados brutos são ingeridos na camada Bronze, limpos, estruturados e enriquecidos na camada Silver, e finalmente agregados na camada Gold para consumo imediato. Todo o ecossistema é orquestrado e automatizado de ponta a ponta com o Apache Airflow.",
                techStack: [
                    "<strong>Ingestão e Processamento:</strong> Python, PySpark, Databricks",
                    "<strong>Orquestração:</strong> Apache Airflow para agendamento e monitoramento de DAGs",
                    "<strong>Versionamento e CI/CD:</strong> Fluxo colaborativo via GitHub",
                    "<strong>Armazenamento:</strong> Estrutura de nuvem (AWS S3)"
                ],
                outcome: "Entrega de pipelines de dados robustos e altamente resilientes, garantindo informações de altíssima qualidade às áreas de negócio em tempo reduzido. O tempo de processamento de dados massivos foi drasticamente otimizado, permitindo tomadas de decisão estratégicas quase em tempo real."
            },
            "etl-automation": {
                title: "Framework Autônomo de Automação de Carga e ETL",
                tags: ["Python", "SQL Server", "APIs", "Databricks", "Windows Server"],
                problem: "Na TOOLS Digital Services, a área de dados lidava com processos exaustivos e altamente manuais de carga diária, gerando atrasos frequentes, alto risco de erro operacional humano e falta de rastreabilidade de falhas.",
                solution: "Desenvolvimento de um framework robusto e totalmente automatizado de integração de pipelines (ETL/ELT). Foram programados scripts em Python capazes de extrair informações de bancos de dados relacionais e APIs externas, ingerindo as cargas diretamente no Databricks. Para garantir resiliência total, os fluxos possuem controle avançado de logs, rotinas de debug integradas e um mecanismo de autorecuperação automática contra falhas.",
                techStack: [
                    "<strong>Scripts de ETL:</strong> Python (pandas, requests, sqlalchemy)",
                    "<strong>Ingestão:</strong> Databricks Lakehouse",
                    "<strong>Infraestrutura:</strong> Execução agendada via Windows Server Task Scheduler e Airflow",
                    "<strong>Bancos de Origem:</strong> Microsoft SQL Server e APIs REST variadas"
                ],
                outcome: "Automatização de 100% das rotinas manuais da área de dados, permitindo que os analistas direcionassem seu foco exclusivamente para análises estratégicas e resolução de problemas complexos de negócio, eliminando o estresse operacional."
            },
            "governance-bi": {
                title: "Plataforma Integrada de Governança de Dados e BI",
                tags: ["Power BI", "Metabase", "Governança", "SQL Server"],
                problem: "Necessidade latente de proteger informações confidenciais corporativas e dados sensíveis, mitigando riscos de vazamento de acessos. Além disso, havia uma carência de visibilidade clara sobre SLAs internos e indicadores de performance operacionais por parte da diretoria executiva.",
                solution: "Criação de dashboards gerenciais de alto nível no Power BI e no Metabase conectando-se a fontes de dados higienizadas e consolidadas. Paralelamente, foi desenvolvido e estruturado um painel centralizado de governança e controle de segurança, garantindo que o acesso a dados sensíveis fosse restrito e auditado dinamicamente com base nas funções de cada usuário.",
                techStack: [
                    "<strong>Visualização de Dados:</strong> Power BI, Metabase",
                    "<strong>Manipulação de Dados:</strong> SQL Avançado para modelagem de visões analíticas",
                    "<strong>Segurança e Governança:</strong> Implementação de políticas de Row-Level Security (RLS) e matrizes de permissão controladas"
                ],
                outcome: "Mitigação total de acessos indevidos e garantia de compliance corporativo. A diretoria executiva passou a contar com relatórios interativos e dinâmicos de SLA operacional, identificando em segundos os gargalos operacionais e as causas-raiz de falhas de performance."
            }
        };

        // Get project from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const projectKey = urlParams.get('project');
        const project = projectsData[projectKey];
        const container = document.getElementById('project-content');

        if (!project) {
            container.innerHTML = `
                <div style="text-align: center; padding: 40px 0;">
                    <h1 style="color: var(--color-text-muted);">Projeto não encontrado</h1>
                    <p>O estudo de caso solicitado não existe ou o link está incorreto.</p>
                    <a href="../index.html#projects" class="back-link">&larr; Ver todos os projetos</a>
                </div>
            `;
            document.title = "Projeto não encontrado - Portfólio Jhone Estefano";
        } else {

        // Render project details
        container.innerHTML = `
            <div class="project-header">
                <h1>${project.title}</h1>
                <div>
                    ${project.tags.map(tag => `<span class="tech-tag">${tag}</span>`).join('')}
                </div>
            </div>

            <section class="section-block" id="problem">
                <h2>O Desafio / Problema</h2>
                <p>${project.problem}</p>
            </section>

            <section class="section-block" id="solution">
                <h2>A Solução Proposta</h2>
                <p>${project.solution}</p>
            </section>

            <section class="section-block" id="tech-stack">
                <h2>Stack Tecnológica Aplicada</h2>
                <ul>
                    ${project.techStack.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </section>

            <section class="section-block" id="outcome">
                <h2>Resultados e Impacto de Negócio</h2>
                <p>${project.outcome}</p>
            </section>
        `;

        // Update browser title
        document.title = `${project.title} - Portfólio Jhone Estefano`;
        }
    </script>
    <script src="../js/main.js"></script>
</body>
</html>
